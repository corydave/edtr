<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WHTBRDR" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- WHTBRDR's mark: a whiteboard on a stand, on a deep rose plate
       (#9f1239, the app's family color). On the board, a marker stroke in
       the same rose; in its corner an orange step badge (#f45922, the
       family accent) with a white "1".
       The same numbers are in make-icons.py, the top bar's inline mark,
       the favicon in index.html and SUITE_MARKS in the shared block:
       edit them all together. -->
