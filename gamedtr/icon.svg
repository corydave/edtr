<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- GAMEDTR's mark, drawn on a 32 x 32 grid. Keep these numbers in step
       with make-icons.py, the inline mark in index.html's top bar, and the
       'gamedtr' entry in SUITE_MARKS in the shared block.
       - a crimson rounded plate (GAMEDTR's family colour, #991b1b)
       - a white game controller: a rounded bar plus two round handles
       - a crimson plus-shaped direction pad on its left
       - two orange buttons on its right (#f45922, the accent every suite
         icon carries) -->
  <rect width="32" height="32" rx="7" fill="#991b1b"/>
  <rect x="3.5" y="9" width="25" height="12" rx="6" fill="#ffffff"/>
  <circle cx="8.5" cy="20.5" r="3.8" fill="#ffffff"/>
  <circle cx="23.5" cy="20.5" r="3.8" fill="#ffffff"/>
  <rect x="8.5" y="12" width="2" height="6" fill="#991b1b"/>
  <rect x="6.5" y="14" width="6" height="2" fill="#991b1b"/>
  <circle cx="21.6" cy="13.6" r="1.6" fill="#f45922"/>
  <circle cx="24.4" cy="16.4" r="1.6" fill="#f45922"/>
</svg>
