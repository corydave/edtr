<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DSKEDTR" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- DSKEDTR's mark: an open two-page spread on a teal plate (#37c6d0,
       the app's family colour, since 0.46.0).
       Left page: an orange picture block (#f45922, the family accent) and
       two text lines. Right page: a headline bar and three text lines.
       The lines are deep teal (#195d61, the same hue, 7.6:1 on the white
       pages) so they read as ink on paper.
       When the app is built, these numbers also go in make-icons.py, the
       top bar's inline mark and SUITE_MARKS - edit them all together. -->
  <rect width="32" height="32" rx="7" fill="#37c6d0"/>
  <rect x="5" y="7" width="10.5" height="18" rx="1.2" fill="#ffffff"/>
  <rect x="16.5" y="7" width="10.5" height="18" rx="1.2" fill="#ffffff"/>
  <rect x="7" y="9" width="6.5" height="6" rx="0.8" fill="#f45922"/>
  <rect x="7" y="17.2" width="6.5" height="1.6" rx="0.8" fill="#195d61"/>
  <rect x="7" y="20.4" width="4.5" height="1.6" rx="0.8" fill="#195d61"/>
  <rect x="18.5" y="9" width="6.5" height="2.6" rx="0.8" fill="#195d61"/>
  <rect x="18.5" y="14" width="6.5" height="1.6" rx="0.8" fill="#195d61"/>
  <rect x="18.5" y="17.2" width="6.5" height="1.6" rx="0.8" fill="#195d61"/>
  <rect x="18.5" y="20.4" width="4.5" height="1.6" rx="0.8" fill="#195d61"/>
</svg>